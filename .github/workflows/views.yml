name: Update Profile Views

on:
  schedule:
    - cron: "0 0 * * *"   # runs daily at midnight
  workflow_dispatch:       # allow manual trigger too

jobs:
  update-views:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Update views.json
        run: |
          FILE=".github/views.json"
          COUNT=$(jq -r '.message' $FILE)
          NEW=$((COUNT + 50)) # increase by 50 per day
          jq --arg new "$NEW" '.message = $new' $FILE > tmp.json && mv tmp.json $FILE

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/views.json
          git commit -m "Update profile views"
          git push
